[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-memory"
# 包版本；记忆库格式版本见 hub.HUB_FORMAT_VERSION（当前 0.7.0）
version = "0.7.6"
description = "宿主无关的本地优先 Markdown 共享记忆库（Skill + CLI + MCP）"
readme = { text = "Multi-Agent Memory 是面向编码代理的本地优先 Markdown 共享记忆库。", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "qxcool" }]
keywords = ["codex", "agents", "memory", "markdown", "collaboration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
memory-hub = "multi_agent_memory.cli:main"
memory-hub-mcp = "multi_agent_memory.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
